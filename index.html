<title>My Criterion Collection</title>
<style>
  :root{
    --bg:#0d0d0f; --panel:#17171a; --panel2:#1f1f24; --border:#2b2b31;
    --text:#eee; --muted:#9a9aa5; --accent:#e0b93a; --owned:#3fa768; --missing:#3a3a42;
    --k4:#a35be0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#111112 0%,#111112cc 100%);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 20px;}
  h1{margin:0 0 10px;font-size:20px;letter-spacing:.3px;display:flex;align-items:center;gap:10px;}
  h1 .badge{background:var(--accent);color:#1a1a1a;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px;}
  .stats b{color:var(--text);}
  .progress{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:12px;}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--owned),#63d68b);}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=text]{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;min-width:220px;}
  select,button{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;}
  button.primary{background:var(--accent);color:#1a1a1a;border:none;font-weight:600;}
  button:hover{border-color:#555;}
  button.primary:hover{filter:brightness(1.08);}
  .toggle-group{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .toggle-group button{border:none;border-radius:0;background:transparent;}
  .toggle-group button.active{background:var(--accent);color:#1a1a1a;font-weight:600;}
  main{padding:20px;}
  /* SHELF GRID */
  #shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s, border-color .12s;position:relative;}
  .card:hover{transform:translateY(-3px);border-color:var(--accent);}
  .card .cover-wrap{position:relative;aspect-ratio:2/3;background:#000;}
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .card.missing img{filter:grayscale(1) brightness(.35);}
  .card.missing .cover-wrap::after{content:"MISSING";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;font-size:11px;font-weight:700;letter-spacing:1px;background:rgba(0,0,0,.15);}
  .card .spine-tag{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);color:var(--accent);font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;}
  .card .owned-tag{position:absolute;top:6px;right:6px;background:var(--owned);color:#fff;font-size:11px;padding:2px 6px;border-radius:5px;}
  .star-toggle{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.65);border:1px solid var(--border);color:#ccc;font-size:15px;line-height:1;width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .star-toggle:hover{border-color:var(--accent);}
  .star-toggle.starred{color:var(--accent);background:rgba(0,0,0,.8);}
  td .star-toggle{position:static;background:none;border:1px solid var(--border);width:auto;height:auto;padding:3px 9px;border-radius:6px;}
  td .star-toggle.starred{background:none;border-color:var(--accent);}
  .card .fmt-row{display:flex;gap:3px;padding:6px;flex-wrap:wrap;}
  .fmt{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;color:#fff;}
  .fmt.k4{background:var(--k4);}
  .k4-toggle{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;user-select:none;}
  .k4-toggle input{margin:0;cursor:pointer;}
  .k4-toggle.checked{background:var(--k4);border-color:var(--k4);color:#fff;}
  .coming-tag{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px;border:1px solid var(--border);background:var(--panel2);color:var(--accent);}
  .card .title{padding:0 8px 8px;font-size:12px;line-height:1.25;}
  .card .title .yr{color:var(--muted);font-size:10px;}
  /* TABLE */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{position:sticky;top:0;background:var(--panel);text-align:left;padding:10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;color:var(--muted);}
  thead th:hover{color:var(--text);}
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:hover{background:var(--panel2);}
  tbody td{padding:8px 10px;}
  .row-owned{color:var(--owned);font-weight:700;}
  .row-missing{color:#777;}
  .thumb-sm{width:34px;height:50px;object-fit:cover;border-radius:3px;}
  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;}
  .modal h2{margin:0 0 4px;font-size:20px;}
  .modal .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .modal-top{display:flex;gap:16px;}
  .modal-top img{width:120px;border-radius:8px;flex-shrink:0;}
  .field{margin:12px 0;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--border);background:var(--panel2);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;}
  .chip.selected.k4{background:var(--k4);border-color:var(--k4);color:#fff;}
  textarea{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;font-size:13px;font-family:inherit;min-height:60px;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px;}
  .close-x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
  .link{color:var(--accent);text-decoration:none;font-size:12px;}
  /* ADD PANEL */
  .add-panel input, .add-panel select{width:100%;margin-bottom:10px;}
  .kv{display:flex;gap:8px;}
  .kv > div{flex:1;}
  .hint{font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:10px;}
  ::-webkit-scrollbar{width:10px;} ::-webkit-scrollbar-thumb{background:#333;border-radius:5px;}

  @media (max-width: 640px){
    header{padding:12px 14px;}
    h1{font-size:17px;}
    .controls{gap:6px;}
    .controls input[type=text]{min-width:0;flex:1 1 100%;}
    .controls select, .controls button{font-size:12px;padding:7px 8px;flex:1 1 auto;}
    main{padding:12px;}
    #shelf{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
    .modal{padding:16px;max-height:92vh;}
    .modal-top{flex-direction:column;}
    .modal-top img{width:100%;max-width:200px;}
    table{font-size:12px;}
    thead th{padding:7px 6px;}
    tbody td{padding:6px 6px;}
    .thumb-sm{width:26px;height:38px;}
  }

</style>
</head>
<body>

<header>

  <div class="controls">

      <option value="missing">Missing only</option>
      <option value="wishlist">⭐ Wishlist only</option>
    </select>
    <select id="formatFilter">
      <option value="any">Any</option>
      <option value="4K">Owned on 4K</option>
      <option value="none">Owned, not on 4K</option>

    <select id="sortBy">

      <option value="year">Sort: Year</option>
      <option value="director">Sort: Director</option>
      <option value="releaseDate">Sort: Release Date</option>

    <button id="sortDir" title="Toggle sort direction">⬆️ Oldest → Newest</button>

      <button id="viewTable">📋 Table</button>
    </div>
    <button id="openAddManual" class="primary">➕ Add a purchase</button>
    <button id="resetFormats" style="color:#e05b5b;border-color:#e05b5b;">🧹 Reset all format tags</button>
    <button id="exportData" title="Download your owned/wishlist/notes/4K data as a JSON file">⬇️ Export my data</button>
    <button id="importData" title="Load a previously exported JSON file">⬆️ Import data</button>
    <input type="file" id="importFileInput" accept="application/json" style="display:none;">
  </div>
</header>

<main>
  <div id="shelf"></div>
  <div id="tableWrap" style="display:none;">
    <table id="dataTable">
      <thead><tr><th></th><th data-k="spine">Spine #</th><th data-k="title">Title</th><th data-k="director">Director</th><th data-k="year">Year</th><th data-k="releaseDate">Release Date</th><th>Formats</th><th>Owned</th><th>Wishlist</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<!-- Detail / Edit modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-x" id="closeModal">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

":"Career Girls","director":"Mike Leigh","country":"United Kingdom","year":"1997","url":"https://www.criterion.com/films/28856-career-girls","image":"","formats":[],"owned":false,"notes":"","wishlist":false,"releaseDate":"2027-01-19"},{"spine":"1344","title":"Chocolat","director":"Claire Denis","country":"France","year":"1988","url":"https://www.criterion.com/films/29200-chocolat","image":"","formats":[],"owned":false,"notes":"","wishlist":false,"releaseDate":"2027-01-26"}];

<script>
const LS_KEY = "criterion_overrides_v1";
const LS_MANUAL = "criterion_manual_additions_v1";

function loadOverrides(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function saveOverrides(o){ localStorage.setItem(LS_KEY, JSON.stringify(o)); }
function loadManual(){ try{ return JSON.parse(localStorage.getItem(LS_MANUAL)) || []; }catch(e){ return []; } }
function saveManual(m){ localStorage.setItem(LS_MANUAL, JSON.stringify(m)); }

let overrides = loadOverrides();   // keyed by spine -> {owned, formats:[], notes}
let manualAdditions = loadManual(); // array of custom records not on master list

function buildDataset(){
  const base = CRITERION_DATA.map((r, i) => {
    const uid = "base-" + i;
    const ov = overrides[uid];
    const availableIn4K = (r.formats||[]).includes("4K");
    return {
      ...r,
      uid,
      availableIn4K,
      owned: ov?.owned !== undefined ? ov.owned : r.owned,
      formats: ov?.formats !== undefined ? ov.formats : [],
      notes: ov?.notes || "",
      wishlist: ov?.wishlist || false,
      isManual: false
    };
  });
  const manual = manualAdditions.map((m, i) => ({...m, uid: m.uid || ("manual-" + i + "-" + Date.now()), availableIn4K: m.availableIn4K || false, wishlist: m.wishlist || false, isManual: true}));
  return base.concat(manual);
}

let DATA = buildDataset();
let currentView = "shelf";
let sortDirDesc = false; // false = ascending, true = descending

function fmtClass(f){
  if(f==="4K") return "k4";
  return "";
}

function formatReleaseDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
}

function renderStats(){
  const total = DATA.filter(d=>!d.isManual).length;
  const owned = DATA.filter(d=>d.owned).length;
  const pct = total ? Math.round((owned/total)*100) : 0;
  document.getElementById("pctBadge").textContent = pct + "%";
  document.getElementById("progressBar").style.width = pct + "%";
  const manualCount = DATA.filter(d=>d.isManual).length;
  const wishlistCount = DATA.filter(d=>d.wishlist).length;
  document.getElementById("statsLine").innerHTML =
    `<span><b>${owned}</b> owned</span>` +
    `<span><b>${total-owned}</b> missing</span>` +
    `<span><b>${total}</b> total spine #s</span>` +
    (manualCount ? `<span><b>${manualCount}</b> manually added</span>` : "") +
    (wishlistCount ? `<span>⭐ <b>${wishlistCount}</b> on wishlist</span>` : "");
}

function getFiltered(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const ownedF = document.getElementById("ownedFilter").value;
  const fmtF = document.getElementById("formatFilter").value;
  const sortBy = document.getElementById("sortBy").value;

  let rows = DATA.filter(r=>{
    if(q){
      const hay = (r.spine+" "+r.title+" "+r.director+" "+(r.year||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(ownedF==="owned" && !r.owned) return false;
    if(ownedF==="missing" && r.owned) return false;
    if(ownedF==="wishlist" && !r.wishlist) return false;
    if(fmtF!=="any"){
      if(!r.owned) return false;
      if(fmtF==="none"){ if((r.formats||[]).length) return false; }
      else { if(!(r.formats||[]).includes(fmtF)) return false; }
    }
    return true;
  });

  rows.sort((a,b)=>{
    let cmp;
    if(sortBy==="spine"){
      const an = parseInt(a.spine)||99999, bn = parseInt(b.spine)||99999;
      cmp = an-bn;
    } else if(sortBy==="year"){
      cmp = (parseInt(a.year)||0)-(parseInt(b.year)||0);
    } else if(sortBy==="releaseDate"){
      // titles with no release date sort last regardless of direction
      const ad = a.releaseDate || "", bd = b.releaseDate || "";
      if(!ad && !bd) cmp = 0;
      else if(!ad) return 1;
      else if(!bd) return -1;
      else cmp = ad.localeCompare(bd);
    } else {
      cmp = (a[sortBy]||"").localeCompare(b[sortBy]||"");
    }
    return sortDirDesc ? -cmp : cmp;
  });
  return rows;
}

function toggle4K(uid, checked){
  const rec = DATA.find(d=>d.uid===uid);
  if(!rec) return;
  const newFormats = checked
    ? Array.from(new Set([...(rec.formats||[]), "4K"]))
    : (rec.formats||[]).filter(f=>f!=="4K");
  if(rec.isManual){
    const idx = manualAdditions.findIndex(m=>m.uid===uid);
    if(idx>-1){
      manualAdditions[idx] = {...manualAdditions[idx], formats: newFormats};
      saveManual(manualAdditions);
    }
  } else {
    const existing = overrides[uid] || {};
    overrides[uid] = {...existing, owned: existing.owned!==undefined?existing.owned:rec.owned, formats: newFormats};
    saveOverrides(overrides);
  }
  DATA = buildDataset();
  render();
}

function toggleWishlist(uid, checked){
  const rec = DATA.find(d=>d.uid===uid);
  if(!rec) return;
  if(rec.isManual){
    const idx = manualAdditions.findIndex(m=>m.uid===uid);
    if(idx>-1){
      manualAdditions[idx] = {...manualAdditions[idx], wishlist: checked};
      saveManual(manualAdditions);
    }
  } else {
    const existing = overrides[uid] || {};
    overrides[uid] = {...existing, owned: existing.owned!==undefined?existing.owned:rec.owned, formats: existing.formats!==undefined?existing.formats:rec.formats, wishlist: checked};
    saveOverrides(overrides);
  }
  DATA = buildDataset();
  render();
}

function renderShelf(){
  const rows = getFiltered();
  const el = document.getElementById("shelf");
  el.innerHTML = rows.map(r=>{
    const img = r.image || "";
    const has4K = (r.formats||[]).includes("4K");
    const fourKBox = r.availableIn4K ? `<label class="k4-toggle ${has4K?'checked':''}" onclick="event.stopPropagation()"><input type="checkbox" ${has4K?'checked':''} onchange="toggle4K('${r.uid}', this.checked)"> 4K</label>` : "";
    const starBtn = `<button class="star-toggle ${r.wishlist?'starred':''}" onclick="event.stopPropagation(); toggleWishlist('${r.uid}', ${!r.wishlist})" title="${r.wishlist?'Remove from wishlist':'Add to wishlist'}">${r.wishlist?'⭐':'☆'}</button>`;
    const comingBadge = (r.releaseDate && !r.owned) ? `<span class="coming-tag">📅 ${formatReleaseDate(r.releaseDate)}</span>` : "";
    return `<div class="card ${r.owned?'':'missing'}" data-uid="${r.uid}">
      <div class="cover-wrap">
        ${img ? `<img src="${img}" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="${r.title}" onerror="this.onerror=null;this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:11px;text-align:center;padding:8px;\\'>Image unavailable</div>'">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:11px;">No image</div>`}
        <span class="spine-tag">#${r.spine||"—"}</span>
        ${r.owned?'<span class="owned-tag">✓</span>':''}
        ${starBtn}
      </div>
      <div class="fmt-row">${fourKBox}${comingBadge}</div>
      <div class="title">${r.title}<br><span class="yr">${r.year||""}</span></div>
    </div>`;
  }).join("");
  el.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("click", ()=> openDetail(c.dataset.uid));
  });
}

function renderTable(){
  const rows = getFiltered();
  const tbody = document.querySelector("#dataTable tbody");
  tbody.innerHTML = rows.map(r=>{
    const has4K = (r.formats||[]).includes("4K");
    const fourKBox = r.availableIn4K ? `<label class="k4-toggle ${has4K?'checked':''}" onclick="event.stopPropagation()"><input type="checkbox" ${has4K?'checked':''} onchange="toggle4K('${r.uid}', this.checked)"> 4K</label>` : "";
    const starBtn = `<button class="star-toggle ${r.wishlist?'starred':''}" onclick="event.stopPropagation(); toggleWishlist('${r.uid}', ${!r.wishlist})" title="${r.wishlist?'Remove from wishlist':'Add to wishlist'}">${r.wishlist?'⭐':'☆'}</button>`;
    return `<tr class="${r.owned?'row-owned':'row-missing'}" data-uid="${r.uid}" style="cursor:pointer">
      <td>${r.image?`<img class="thumb-sm" src="${r.image}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:''}</td>
      <td>${r.spine||"—"}</td>
      <td>${r.title}</td>
      <td>${r.director||""}</td>
      <td>${r.year||""}</td>
      <td>${(r.releaseDate && !r.owned) ? formatReleaseDate(r.releaseDate) : ""}</td>
      <td>${fourKBox}</td>
      <td>${r.owned?"✅":"—"}</td>
      <td>${starBtn}</td>
    </tr>`;
  }).join("");
  tbody.querySelectorAll("tr").forEach(tr=>{
    tr.addEventListener("click", ()=> openDetail(tr.dataset.uid));
  });
}

function render(){
  renderStats();
  if(currentView==="shelf"){ renderShelf(); } else { renderTable(); }
}

function openDetail(uid){
  const rec = DATA.find(d => d.uid===uid);
  if(!rec) return;
  const modal = document.getElementById("modalBody");
  const fmtChips = ["4K"].map(f=>{
    const sel = (rec.formats||[]).includes(f) ? "selected " + fmtClass(f) : "";
    return `<span class="chip ${sel}" data-fmt="${f}">${f}</span>`;
  }).join("");
  modal.innerHTML = `
    <div class="modal-top">
      ${rec.image?`<img src="${rec.image}" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:''}
      <div>
        <h2>${rec.title}</h2>
        <div class="sub">${rec.director||""} · ${rec.country||""} · ${rec.year||""} · Spine #${rec.spine||"—"}</div>
        ${rec.releaseDate && !rec.owned ? `<div class="sub">📅 Releases ${formatReleaseDate(rec.releaseDate)}</div>` : ''}
        ${rec.url?`<a class="link" href="${rec.url}" target="_blank">View on Criterion.com →</a>`:''}
      </div>
    </div>
    <div class="field">
      <label>Ownership</label>
      <label><input type="checkbox" id="ownedCheck" ${rec.owned?"checked":""}> I own this</label>
    </div>
    <div class="field">
      <label>Wishlist</label>
      <label><input type="checkbox" id="wishlistCheck" ${rec.wishlist?"checked":""}> ⭐ Priority to buy next</label>
    </div>
    <div class="field">
      <label>Format(s) I own</label>
      <div class="chip-row" id="fmtChips">${fmtChips}</div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="notesArea" placeholder="e.g. OOP, bought at record store, waiting for restock...">${rec.notes||""}</textarea>
    </div>
    <div class="modal-actions">
      <button id="deleteManual" style="display:${rec.isManual?'inline-block':'none'};color:#e05b5b;border-color:#e05b5b;">🗑 Remove entry</button>
      <button class="primary" id="saveDetail">Save changes</button>
    </div>
  `;
  modal.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      chip.classList.toggle("selected");
      chip.classList.toggle(fmtClass(chip.dataset.fmt));
    });
  });
  document.getElementById("saveDetail").addEventListener("click", ()=>{
    const owned = document.getElementById("ownedCheck").checked;
    const wishlist = document.getElementById("wishlistCheck").checked;
    const formats = Array.from(modal.querySelectorAll(".chip.selected")).map(c=>c.dataset.fmt);
    const notes = document.getElementById("notesArea").value;
    if(rec.isManual){
      const idx = manualAdditions.findIndex(m=>m.uid===uid);
      if(idx>-1){
        manualAdditions[idx] = {...manualAdditions[idx], owned, formats, notes, wishlist};
        saveManual(manualAdditions);
      }
    } else {
      overrides[uid] = {owned, formats, notes, wishlist};
      saveOverrides(overrides);
    }
    DATA = buildDataset();
    render();
    closeOverlay();
  });
  const delBtn = document.getElementById("deleteManual");
  delBtn.addEventListener("click", ()=>{
    manualAdditions = manualAdditions.filter(m=>m.uid!==uid);
    saveManual(manualAdditions);
    DATA = buildDataset();
    render();
    closeOverlay();
  });
  document.getElementById("overlay").classList.add("show");
}

function openAddManualForm(){
  const modal = document.getElementById("modalBody");
  modal.innerHTML = `
    <h2>➕ Add a title</h2>
    <div class="sub">For titles not yet in the master list — a purchase you made, or something you want to add to your wishlist.</div>
    <div class="field add-panel">
      <label>Title *</label>
      <input type="text" id="m_title" placeholder="e.g. The World of Wong Kar Wai">
      <div class="kv">
        <div><label>Spine # (optional)</label><input type="text" id="m_spine" placeholder="e.g. 1200 or 850/851"></div>
        <div><label>Year</label><input type="text" id="m_year" placeholder="e.g. 2021"></div>
      </div>
      <label>Director</label>
      <input type="text" id="m_director" placeholder="e.g. Wong Kar Wai">
      <label>Country</label>
      <input type="text" id="m_country" placeholder="e.g. Hong Kong">
      <label>Cover image URL (optional — paste from criterion.com)</label>
      <input type="text" id="m_image" placeholder="https://...jpg">
      <div class="hint">Right-click a cover on criterion.com → Copy Image Address</div>
      <label style="margin-top:10px;display:block;"><input type="checkbox" id="m_owned" checked> I own this</label>
      <label style="margin-top:6px;display:block;"><input type="checkbox" id="m_wishlist"> ⭐ Add to wishlist</label>
      <label style="margin-top:10px;display:block;">Format(s) owned</label>
      <div class="chip-row" id="m_fmtChips">
        <span class="chip" data-fmt="4K">4K</span>
      </div>
      <label style="margin-top:10px;display:block;">Notes</label>
      <textarea id="m_notes" placeholder="optional notes"></textarea>
    </div>
    <div class="modal-actions">
      <span></span>
      <button class="primary" id="saveManualBtn">Add</button>
    </div>
  `;
  modal.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      chip.classList.toggle("selected");
      chip.classList.toggle(fmtClass(chip.dataset.fmt));
    });
  });
  document.getElementById("saveManualBtn").addEventListener("click", ()=>{
    const title = document.getElementById("m_title").value.trim();
    if(!title){ alert("Title is required"); return; }
    let spine = document.getElementById("m_spine").value.trim();
    if(!spine) spine = "manual-" + Date.now();
    const formats = Array.from(modal.querySelectorAll(".chip.selected")).map(c=>c.dataset.fmt);
    const rec = {
      uid: "manual-" + Date.now() + "-" + Math.random().toString(36).slice(2,8),
      spine, title,
      director: document.getElementById("m_director").value.trim(),
      country: document.getElementById("m_country").value.trim(),
      year: document.getElementById("m_year").value.trim(),
      url: "", image: document.getElementById("m_image").value.trim(),
      formats, owned: document.getElementById("m_owned").checked,
      wishlist: document.getElementById("m_wishlist").checked,
      notes: document.getElementById("m_notes").value.trim()
    };
    manualAdditions.push(rec);
    saveManual(manualAdditions);
    DATA = buildDataset();
    render();
    closeOverlay();
  });
  document.getElementById("overlay").classList.add("show");
}

function closeOverlay(){ document.getElementById("overlay").classList.remove("show"); }
document.getElementById("closeModal").addEventListener("click", closeOverlay);
document.getElementById("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeOverlay(); });
document.getElementById("openAddManual").addEventListener("click", openAddManualForm);

document.getElementById("resetFormats").addEventListener("click", ()=>{
  if(!confirm("Reset all 4K tags back to blank? Ownership, wishlist, and notes will NOT be affected.")) return;
  Object.keys(overrides).forEach(k=>{ if(overrides[k]) overrides[k].formats = []; });
  saveOverrides(overrides);
  manualAdditions = manualAdditions.map(m=>({...m, formats: []}));
  saveManual(manualAdditions);
  DATA = buildDataset();
  render();
});

document.getElementById("exportData").addEventListener("click", ()=>{
  const payload = {
    exportedAt: new Date().toISOString(),
    overrides: overrides,
    manualAdditions: manualAdditions
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const stamp = new Date().toISOString().slice(0,10);
  a.download = `criterion_my_data_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById("importData").addEventListener("click", ()=>{
  document.getElementById("importFileInput").click();
});
document.getElementById("importFileInput").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const payload = JSON.parse(ev.target.result);
      if(!payload || typeof payload !== "object") throw new Error("bad format");
      const mode = confirm("Click OK to MERGE with your current data, or Cancel to REPLACE it entirely.") ? "merge" : "replace";
      if(mode === "merge"){
        overrides = {...overrides, ...(payload.overrides||{})};
        const existingUids = new Set(manualAdditions.map(m=>m.uid));
        const incoming = (payload.manualAdditions||[]).filter(m=>!existingUids.has(m.uid));
        manualAdditions = manualAdditions.concat(incoming);
      } else {
        overrides = payload.overrides || {};
        manualAdditions = payload.manualAdditions || [];
      }
      saveOverrides(overrides);
      saveManual(manualAdditions);
      DATA = buildDataset();
      render();
      alert("Import complete!");
    }catch(err){
      alert("Could not read that file — make sure it's a JSON export from this app.");
    }
    document.getElementById("importFileInput").value = "";
  };
  reader.readAsText(file);
});

document.getElementById("search").addEventListener("input", render);
document.getElementById("ownedFilter").addEventListener("change", render);
document.getElementById("formatFilter").addEventListener("change", render);
document.getElementById("sortBy").addEventListener("change", render);
document.getElementById("sortDir").addEventListener("click", ()=>{
  sortDirDesc = !sortDirDesc;
  updateSortDirLabel();
  render();
});

function updateSortDirLabel(){
  const btn = document.getElementById("sortDir");
  btn.textContent = sortDirDesc ? "⬇️ Newest → Oldest" : "⬆️ Oldest → Newest";
}

document.querySelectorAll("#dataTable thead th[data-k]").forEach(th=>{
  th.addEventListener("click", ()=>{
    const key = th.dataset.k;
    const sortSelect = document.getElementById("sortBy");
    if(sortSelect.value === key){
      sortDirDesc = !sortDirDesc;
    } else {
      sortSelect.value = key;
      sortDirDesc = false;
    }
    updateSortDirLabel();
    render();
  });
});

document.getElementById("viewShelf").addEventListener("click", ()=>{
  currentView="shelf";
  document.getElementById("viewShelf").classList.add("active");
  document.getElementById("viewTable").classList.remove("active");
  document.getElementById("shelf").style.display="grid";
  document.getElementById("tableWrap").style.display="none";
  render();
});
document.getElementById("viewTable").addEventListener("click", ()=>{
  currentView="table";
  document.getElementById("viewTable").classList.add("active");
  document.getElementById("viewShelf").classList.remove("active");
  document.getElementById("shelf").style.display="none";
  document.getElementById("tableWrap").style.display="block";
  render();
});

render();
</script>
</body>
</html>
